plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}
repositories { mavenCentral() }
sourceSets {
    testmod {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}
loom {
    splitEnvironmentSourceSets()
    mods {
        "regnum_agriculture" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
    runs {
        gameTest {
            server()
            name 'Regnum Agriculture GameTest'
            vmArg '-Dfabric-api.gametest'
            vmArg '-Dfabric-api.gametest.report-file=reports/gametest-results.xml'
            runDir 'build/gametest'
            source sourceSets.testmod
        }
    }
}
loom.mods {
    "regnum_agriculture_tests" { sourceSet sourceSets.testmod }
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    if (providers.gradleProperty('regnumWorldJar').isPresent()) {
        modRuntimeOnly files(providers.gradleProperty('regnumWorldJar').get())
    }
}
processResources {
    def modVersion = project.version
    inputs.property 'version', modVersion
    filesMatching('fabric.mod.json') { expand version: modVersion }
}
tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
test {
    useJUnitPlatform()
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}
jar {
    from('LICENSE', 'THIRD_PARTY_NOTICES.md')
    from('docs/TEMPLATE_LICENSE_CC0.txt') { into 'docs' }
}

tasks.named('sourcesJar') {
    from('LICENSE', 'THIRD_PARTY_NOTICES.md')
    from('docs/TEMPLATE_LICENSE_CC0.txt') { into 'docs' }
}

// Avoid the vanilla first-launch missing-properties error in headless test runs.
def gameTestProperties = layout.buildDirectory.file('gametest/server.properties')
tasks.register('prepareGameTestDirectory') {
    outputs.file(gameTestProperties)
    doLast {
        def propertiesFile = gameTestProperties.get().asFile
        propertiesFile.parentFile.mkdirs()
        if (!propertiesFile.exists()) propertiesFile.text = 'spawn-protection=0\n'
    }
}
tasks.named('runGameTest') { dependsOn 'prepareGameTestDirectory' }

tasks.named('runServer') { standardInput = System.in }

// Loom 1.14 materializes launch argument files during configuration. A clean
// build removes those files, so runtime launches must configure them afresh.
['runGameTest', 'runServer', 'runClient'].each { runTask ->
    tasks.named(runTask) {
        notCompatibleWithConfigurationCache('Loom launch argument files must be regenerated after clean')
    }
}
