plugins {
    id 'fabric-loom' version '1.16.3'
    id 'maven-publish'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "regnum-agriculture"
}

allprojects {
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Xmaxerrs" << "1000"
            options.compilerArgs << "-Xmaxwarns" << "1000"
        }
    }
}

fabricApi {
    configureDataGeneration {
        outputDirectory = file("src/generated/resources")
        strictValidation = false
        createSourceSet = true
        modId = project.mod_id
    }
}

sourceSets {
    testmod {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

loom {
    mods {
        "regnum-agriculture" { sourceSet sourceSets.main }
        "regnum_agriculture_tests" { sourceSet sourceSets.testmod }
    }
    runs {
        clientValidation {
            client()
            name "Agriculture isolated client validation"
            runDir "build/client-validation"
        }
        gameTest {
            server()
            name "Agriculture isolated GameTest"
            vmArg "-Dfabric-api.gametest"
            if (providers.gradleProperty("expectWorldFailure").isPresent()) {
                vmArg "-Dregnum.agriculture.expectWorldFailure=true"
            }
            vmArg "-Dfabric-api.gametest.report-file=reports/gametest-results.xml"
            runDir "build/gametest"
            source sourceSets.testmod
        }
    }
    accessWidenerPath = file("src/main/resources/farmersdelight.classtweaker")
}

repositories {

    flatDir {
        dirs 'mods'
    }

    maven { url "https://maven.parchmentmc.org" }

    maven {
        url = "https://www.cursemaven.com"
        allowInsecureProtocol = true
    }

    maven {
        url "https://maven.firstdarkdev.xyz/snapshots"
    }

    maven {
        name = 'Ladysnake Mods'
        url = 'https://maven.ladysnake.org/releases'
    }

    maven {
        url = "https://api.modrinth.com/maven"
    }

    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com/"
    }
    maven { url "https://maven.ryanliptak.com/" } // AppleSkin
    maven { url = "https://maven.parchmentmc.org" } // Parchment
    maven { url = "https://maven.fabricmc.net/" } // FAPI, Loader
    maven { url = "https://maven.architectury.dev/" } // REI and deps
    maven { url = "https://maven.shedaniel.me/" } // REI and deps
    maven { url = "https://maven.terraformersmc.com/" } // Mod Menu, EMI
    mavenCentral()
}

dependencies {
    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    if (providers.gradleProperty("regnumWorldJar").isPresent()) {
        modRuntimeOnly files(providers.gradleProperty("regnumWorldJar").get())
    }

    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    mappings loom.layered() {
        it.officialMojangMappings {
            setNameSyntheticMembers(false)
        }
        it.parchment("org.parchmentmc.data:parchment-${project.parchment_version}")
    }

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:${cloth_version}")
    modCompileOnly("curse.maven:yacl-667299:5424169")
    modCompileOnly("com.terraformersmc:modmenu:${project.modmenu_version}")
    modLocalRuntime("com.terraformersmc:modmenu:${project.modmenu_version}")
    modLocalRuntime("me.shedaniel.cloth:cloth-config-fabric:${cloth_version}")

    modCompileOnly("com.blamejared.crafttweaker:CraftTweaker-fabric-${minecraft_version}:${crafttweaker_version}")

    modCompileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    modCompileOnly("mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}")

    modCompileOnly("me.shedaniel.cloth:basic-math:0.6.1")
    modCompileOnly("dev.architectury:architectury-fabric:16.1.4")
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${rei_version}"
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:${rei_version}"

    modCompileOnly("dev.emi:emi-fabric:${emi_version}:api") {
        exclude(group: "net.fabricmc.fabric-api")
    }
}

processResources {
    var replaceProperties = [
            minecraft_version    : minecraft_version,
            minecraft_min_version: minecraft_min_version,
            minecraft_max_version: minecraft_max_version,

            mod_id               : mod_id,
            mod_name             : mod_name,
            mod_version          : version,
            mod_license          : mod_license,
            mod_authors          : mod_authors,
            mod_description      : mod_description,
            mod_credits          : mod_credits,
            mod_homepage         : mod_homepage,
            mod_github           : mod_github,
            fabric_loader_version: fabric_loader_version,
            fabric_api_version   : fabric_api_version
    ]
    inputs.properties replaceProperties

    filesMatching("fabric.mod.json") {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("THIRD_PARTY_NOTICES.md")
    from("licenses") { into "licenses" }
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}"}
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId project.base.archivesName.get()
            version project.version
            from components.java
        }
    }

}

test { useJUnitPlatform() }

// Never reuse a developer or production world for automated checks.
tasks.register('prepareGameTestDirectory') {
    doLast {
        def propertiesFile = layout.buildDirectory.file('gametest/server.properties').get().asFile
        propertiesFile.parentFile.mkdirs()
        if (!propertiesFile.exists()) propertiesFile.text = 'spawn-protection=0\n'
    }
}
tasks.named('runGameTest') { dependsOn 'prepareGameTestDirectory' }

tasks.named('sourcesJar') {
    from('LICENSE', 'THIRD_PARTY_NOTICES.md')
    from('licenses') { into 'licenses' }
}
